name: Fix empty timestamp tooltip v1.4.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-empty-timestamp-tooltip-v1.4.14.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collector
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(base64.b64decode(''))"
          node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Capture empty timestamp tooltip dates'
          git push origin HEAD:main
