name: Fix empty timestamp tooltip v1.4.14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-empty-timestamp-tooltip-v1.4.14.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('tampermonkey/facebook-posts-to-wordpress.user.js')
          src = path.read_text(encoding='utf-8')

          old_version = '// @version      1.4.13'
          new_version = '// @version      1.4.14'
          if old_version not in src:
              raise SystemExit('Expected collector version 1.4.13 not found')
          src = src.replace(old_version, new_version, 1)

          old_dispatch = r'''    function dispatchHover(el) {
        if (!el) return;
        try { el.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (_) {}

        const common = { bubbles: true, cancelable: true, view: window };

        try {
            el.dispatchEvent(new PointerEvent('pointerover', {
                ...common, pointerId: 1, pointerType: 'mouse', isPrimary: true
            }));
            el.dispatchEvent(new PointerEvent('pointerenter', {
                ...common, pointerId: 1, pointerType: 'mouse', isPrimary: true
            }));
        } catch (_) {}

        for (const type of ['mouseover', 'mouseenter', 'mousemove']) {
            try { el.dispatchEvent(new MouseEvent(type, common)); } catch (_) {}
        }
    }'''

          new_dispatch = r'''    function dispatchHover(el) {
        if (!el) return;
        try { el.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (_) {}

        const rect = el.getBoundingClientRect?.();
        const clientX = rect ? Math.round(rect.left + Math.max(1, rect.width) / 2) : 1;
        const clientY = rect ? Math.round(rect.top + Math.max(1, rect.height) / 2) : 1;
        const common = {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX,
            clientY,
            screenX: clientX,
            screenY: clientY
        };

        try {
            for (const type of ['pointerover', 'pointerenter', 'pointermove']) {
                el.dispatchEvent(new PointerEvent(type, {
                    ...common,
                    pointerId: 1,
                    pointerType: 'mouse',
                    isPrimary: true
                }));
            }
        } catch (_) {}

        for (const type of ['mouseover', 'mouseenter', 'mousemove']) {
            try { el.dispatchEvent(new MouseEvent(type, common)); } catch (_) {}
        }
    }'''

          if old_dispatch not in src:
              raise SystemExit('dispatchHover block not found')
          src = src.replace(old_dispatch, new_dispatch, 1)

          start = src.find('    async function getDateFromHover(timestampEl) {')
          end = src.find('\n    async function extractDate(article) {', start)
          if start < 0 or end < 0:
              raise SystemExit('getDateFromHover block not found')

          new_hover = r'''    async function getDateFromHover(timestampEl) {
        if (!timestampEl) {
            return { date: null, source: '', hoverDebug: [] };
        }

        const observed = new Set();
        const baseline = new Set(collectTooltipTexts());
        const existingTooltips = new Set(
            [...document.querySelectorAll('[role="tooltip"]')]
        );

        function addValue(value) {
            const t = String(value || '')
                .replace(/\u202f/g, ' ')
                .trim();

            if (
                t &&
                t.length <= 240 &&
                looksLikeDateText(t) &&
                !baseline.has(t)
            ) {
                observed.add(t);
            }
        }

        function collectFromElement(el) {
            if (!(el instanceof Element)) return;

            for (const v of [
                el.getAttribute?.('aria-label'),
                el.getAttribute?.('title'),
                el.innerText,
                el.textContent
            ]) {
                addValue(v);
            }
        }

        const observer = new MutationObserver(mutations => {
            for (const mutation of mutations) {
                for (const node of mutation.addedNodes) {
                    if (!(node instanceof Element)) continue;

                    const candidates = [];
                    if (
                        node.matches?.(
                            '[role="tooltip"], [data-visualcompletion="ignore-dynamic"], [aria-live="polite"]'
                        )
                    ) {
                        candidates.push(node);
                    }

                    candidates.push(...(
                        node.querySelectorAll?.(
                            '[role="tooltip"], [data-visualcompletion="ignore-dynamic"], [aria-live="polite"]'
                        ) || []
                    ));

                    for (const el of candidates) {
                        if (
                            el.matches?.('[role="tooltip"]') &&
                            existingTooltips.has(el)
                        ) {
                            continue;
                        }

                        collectFromElement(el);
                    }
                }
            }
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        function collectNewTooltipTexts() {
            for (const value of collectTooltipTexts()) {
                addValue(value);
            }
        }

        dispatchHover(timestampEl);

        const hoverStarted = Date.now();
        while (Date.now() - hoverStarted < 1200) {
            collectNewTooltipTexts();

            if ([...observed].some(value => {
                const d = parseFbDate(value);
                return d && !isNaN(d);
            })) {
                break;
            }

            await new Promise(resolve => setTimeout(resolve, 100));
            dispatchHover(timestampEl);
        }

        if (!observed.size && timestampEl.isConnected) {
            try {
                timestampEl.focus({ preventScroll: true });
            } catch (_) {
                try { timestampEl.focus(); } catch (_) {}
            }

            const focusStarted = Date.now();
            while (Date.now() - focusStarted < 700) {
                collectNewTooltipTexts();
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            try { timestampEl.blur(); } catch (_) {}
        }

        observer.disconnect();
        dispatchUnhover(timestampEl);
        collectNewTooltipTexts();

        for (const candidate of observed) {
            const d = parseFbDate(candidate);
            if (d && !isNaN(d)) {
                return {
                    date: d,
                    source: 'main timestamp tooltip: ' + candidate,
                    hoverDebug: [...observed].slice(0, 8)
                };
            }
        }

        return {
            date: null,
            source: [...observed].slice(0, 5).join(' | '),
            hoverDebug: [...observed].slice(0, 8)
        };
    }
'''

          src = src[:start] + new_hover + src[end:]

          if 'const VERSION = String(GM_info.script.version);' not in src:
              raise SystemExit('Single version source missing')
          if 'main timestamp tooltip:' not in src:
              raise SystemExit('Tooltip source missing')
          if 'hoverDebug:' not in src:
              raise SystemExit('Hover diagnostics missing')

          runtime_without_metadata = re.sub(
              r'^// @version\s+.*$',
              '',
              src,
              count=1,
              flags=re.M
          )
          stale = re.findall(r'\bv\d+\.\d+(?:\.\d+)?\b', runtime_without_metadata)
          if stale:
              raise SystemExit(f'Hard-coded version strings remain: {stale[:10]}')

          path.write_text(src, encoding='utf-8')
          PY

          node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Capture empty timestamp tooltip dates'
          git push origin HEAD:main
