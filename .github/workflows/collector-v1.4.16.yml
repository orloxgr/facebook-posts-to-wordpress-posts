name: Collector v1.4.16

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-v1.4.16.py'
      - '.github/workflows/collector-v1.4.16.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collector
        run: |
          python3 .github/patch-v1.4.16.py
          node --check tampermonkey/facebook-posts-to-wordpress.user.js
      - name: Verify changes
        run: |
          set -euo pipefail
          grep -q '^// @version      1.4.16$' tampermonkey/facebook-posts-to-wordpress.user.js
          grep -q 'async function retryUnresolved()' tampermonkey/facebook-posts-to-wordpress.user.js
          grep -q 'id="fbwp-retry-unresolved"' tampermonkey/facebook-posts-to-wordpress.user.js
          ! grep -q 'secondPassRecovered' tampermonkey/facebook-posts-to-wordpress.user.js
          ! grep -q 'PASS 2:' tampermonkey/facebook-posts-to-wordpress.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add manual unresolved retry and run-scoped collection'
          git push origin HEAD:main
