name: Release WordPress plugin v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release WordPress plugin v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd wordpress-plugin
          zip -r ../facebook-posts-to-wordpress-v1.0.0.zip facebook-posts-to-wordpress \
            -x '*/.DS_Store' '*/Thumbs.db'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create plugin-v1.0.0 \
            facebook-posts-to-wordpress-v1.0.0.zip \
            --target "$GITHUB_SHA" \
            --title "WordPress Plugin v1.0.0" \
            --notes "Initial WordPress plugin release. Imports Facebook collector JSON archives into WordPress with original dates, hashtags as tags, media import, featured image, duplicate protection, validation, Import 1 and Import ALL. This release ZIP contains only the WordPress plugin."
