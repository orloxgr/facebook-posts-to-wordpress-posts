name: Normalize collector version source

on: [push]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event.head_commit.message == 'Normalize collector version source' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build canonical collector
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('tampermonkey/facebook-posts-to-wordpress-v1.4.8.user.js')
          src = source_path.read_text(encoding='utf-8')

          # Single source of truth: userscript metadata @version.
          src = re.sub(r'^// @version\s+.*$', '// @version      1.4.9', src, count=1, flags=re.M)

          canonical_url = 'https://raw.githubusercontent.com/orloxgr/facebook-posts-to-wordpress-posts/main/tampermonkey/facebook-posts-to-wordpress.user.js'
          if '// @updateURL' not in src:
              src = src.replace(
                  '// @description  Collect Facebook Page posts to JSON for WordPress import, preserving source dates, text and photos.\n',
                  '// @description  Collect Facebook Page posts to JSON for WordPress import, preserving source dates, text and photos.\n'
                  f'// @updateURL    {canonical_url}\n'
                  f'// @downloadURL  {canonical_url}\n',
                  1
              )
          if '// @grant        GM_info' not in src:
              src = src.replace('// @grant        GM_deleteValue\n', '// @grant        GM_deleteValue\n// @grant        GM_info\n', 1)

          marker = "    'use strict';\n"
          runtime = (
              "    'use strict';\n\n"
              "    // Runtime version always comes from the single @version metadata field above.\n"
              "    const VERSION = String(GM_info.script.version);\n"
              "    const VERSION_KEY = VERSION.replace(/[^0-9A-Za-z]+/g, '_').replace(/^_+|_+$/g, '');\n"
          )
          if 'const VERSION = String(GM_info.script.version);' not in src:
              src = src.replace(marker, runtime, 1)

          src = src.replace('`fbwp_${PAGE_CONTEXT_KEY}_imported_v1_4_8`', '`fbwp_${PAGE_CONTEXT_KEY}_imported_${VERSION_KEY}`')
          src = src.replace('`fbwp_${PAGE_CONTEXT_KEY}_archive_v1_4_8`', '`fbwp_${PAGE_CONTEXT_KEY}_archive_${VERSION_KEY}`')
          src = src.replace('`fbwp_${PAGE_CONTEXT_KEY}_cutoff_v1_4_8`', '`fbwp_${PAGE_CONTEXT_KEY}_cutoff_${VERSION_KEY}`')

          src = src.replace(
              '         * v1.4.8 uses ONLY its own page-scoped Tampermonkey storage.\n',
              '         * Each collector version uses ONLY its own page-scoped Tampermonkey storage.\n'
          )
          src = src.replace(
              "            'Να διαγραφεί ΟΛΗ η συλλογή του v1.4.1;'",
              "            `Να διαγραφεί ΟΛΗ η συλλογή του v${VERSION};`"
          )
          src = src.replace(
              "                '[FB→WP] v1.4.1 state delete failed:',",
              "                `[FB→WP] v${VERSION} state delete failed:`,"
          )
          src = src.replace('                Facebook → WordPress v1.4.8', '                Facebook → WordPress v${VERSION}')

          # One active/canonical collector file. No loader, @require, payload, or versioned active copies.
          canonical_path = Path('tampermonkey/facebook-posts-to-wordpress.user.js')
          canonical_path.write_text(src, encoding='utf-8')

          # READMEs should not duplicate the current version literal.
          t_readme = Path('tampermonkey/README.md')
          text = t_readme.read_text(encoding='utf-8')
          text = re.sub(r'Current collector: \*\*v[^*]+\*\*\.', 'Current collector version is defined only by the `@version` field in `facebook-posts-to-wordpress.user.js`.', text)
          text = text.replace('The userscript includes `@updateURL` and `@downloadURL` pointing to that same raw GitHub file, so Tampermonkey can update the loader automatically when a newer version is published.', 'The userscript includes `@updateURL` and `@downloadURL` pointing to that same raw GitHub file, so Tampermonkey can update it automatically when `@version` changes.')
          text = re.sub(r'The loader fetches the versioned generic v[^\s]+ payload and verifies its SHA-256 before running it\. The readable v[^\s]+ collector source is also included in this directory\.\n?', '', text)
          text = text.replace('The collector now exports JSON only; the obsolete direct WordPress import controls have been removed from the panel.', 'The collector exports JSON only; WordPress importing is handled by the plugin.')
          t_readme.write_text(text, encoding='utf-8')

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          text = re.sub(r'Contains the browser collector\. Current collector: \*\*v[^*]+\*\*\.', 'Contains the browser collector. Its version is defined only by the userscript `@version` metadata.', text)
          text = text.replace('The userscript includes `@updateURL` and `@downloadURL` pointing to that same raw GitHub file, so Tampermonkey can update the loader automatically when a newer version is published.', 'The userscript includes `@updateURL` and `@downloadURL` pointing to that same raw GitHub file, so Tampermonkey can update it automatically when `@version` changes.')
          root.write_text(text, encoding='utf-8')

          # Remove obsolete duplicate collector sources/payloads.
          for p in [
              Path('tampermonkey/facebook-posts-to-wordpress-v1.4.7.user.js'),
              Path('tampermonkey/facebook-posts-to-wordpress-v1.4.8.user.js'),
              Path('tampermonkey/payload/v1.4.7.b64'),
          ]:
              if p.exists():
                  p.unlink()

          # Sanity checks: only one collector version literal, in metadata.
          final = canonical_path.read_text(encoding='utf-8')
          if final.count('1.4.9') != 1:
              raise SystemExit(f'Expected exactly one literal 1.4.9 in canonical userscript, found {final.count("1.4.9")}')
          for stale in ['v1.4.1', 'v1.4.6', 'v1.4.7', 'v1.4.8', 'v1_4_8', '@require']:
              if stale in final:
                  raise SystemExit(f'Stale version/loader reference remains in canonical userscript: {stale}')
          required = [
              'const VERSION = String(GM_info.script.version);',
              'Facebook → WordPress v${VERSION}',
              'συλλογή του v${VERSION}',
              'archive_${VERSION_KEY}',
          ]
          for value in required:
              if value not in final:
                  raise SystemExit(f'Missing dynamic version usage: {value}')
          PY

          node --check tampermonkey/facebook-posts-to-wordpress.user.js

          # Across active docs + canonical collector, the current literal must exist only once.
          COUNT=$(grep -R --exclude-dir=.git -F '1.4.9' tampermonkey/facebook-posts-to-wordpress.user.js tampermonkey/README.md README.md | wc -l)
          test "$COUNT" -eq 1

      - name: Commit normalized collector
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tampermonkey README.md
          git commit -m 'Use one collector version source'
          git push origin HEAD:main
