name: Collector v1.4.18

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-v1.4.18.py'
      - '.github/workflows/collector-v1.4.18.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collector
        run: |
          python3 .github/patch-v1.4.18.py
          node --check tampermonkey/facebook-posts-to-wordpress.user.js
      - name: Verify changes
        run: |
          set -euo pipefail
          grep -q '^// @version      1.4.18$' tampermonkey/facebook-posts-to-wordpress.user.js
          grep -Fq ".replace(/[\\u200B-\\u200F\\u2060\\uFEFF]/g, '')" tampermonkey/facebook-posts-to-wordpress.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git diff --cached --quiet && exit 0
          git commit -m 'Strip invisible Facebook timestamp characters'
          git push origin HEAD:main
