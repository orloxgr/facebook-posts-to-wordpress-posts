name: Fix unresolved date diagnostics

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Fix unresolved date diagnostics' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch collector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tampermonkey/facebook-posts-to-wordpress.user.js')
          src = path.read_text(encoding='utf-8')

          old_version = '// @version      1.4.9'
          new_version = '// @version      1.4.10'
          if old_version not in src:
              raise SystemExit('Expected collector version 1.4.9 not found')
          src = src.replace(old_version, new_version, 1)

          old = '''        const chooseIncomingDate = Boolean(bDate);\n        const chosenDate = chooseIncomingDate\n            ? bDate\n            : aDate;'''
          new = '''        const chooseIncomingDate = Boolean(bDate);\n        const chosenDate = chooseIncomingDate\n            ? bDate\n            : aDate;\n\n        /*\n         * Keep timestamp diagnostics for unresolved incoming snapshots.\n         * Previously mergeArchiveItems({}, snapshot) discarded dateSource/dateDebug\n         * whenever b.dateIso was null, which made unresolved posts impossible to\n         * diagnose after export. A dated existing item still keeps its own\n         * diagnostics when merged with a later unresolved snapshot.\n         */\n        const incomingHasDateDiagnostics =\n            Boolean(b.dateSource) ||\n            b.dateDebug != null;\n\n        const useIncomingDateDiagnostics =\n            chooseIncomingDate ||\n            (!aDate && incomingHasDateDiagnostics);'''
          if old not in src:
              raise SystemExit('Date selection block not found')
          src = src.replace(old, new, 1)

          old = '''            dateSource:\n                chooseIncomingDate\n                    ? (b.dateSource || '')\n                    : (a.dateSource || ''),\n\n            dateDebug:\n                chooseIncomingDate\n                    ? (b.dateDebug || null)\n                    : (a.dateDebug || null),'''
          new = '''            dateSource:\n                useIncomingDateDiagnostics\n                    ? (b.dateSource || '')\n                    : (a.dateSource || ''),\n\n            dateDebug:\n                useIncomingDateDiagnostics\n                    ? (b.dateDebug ?? null)\n                    : (a.dateDebug ?? null),'''
          if old not in src:
              raise SystemExit('dateSource/dateDebug merge block not found')
          src = src.replace(old, new, 1)

          # Guard the single-source version design: only @version is literal runtime version.
          if "const VERSION = String(GM_info.script.version);" not in src:
              raise SystemExit('GM_info version source missing')
          if 'v1.4.1' in src or 'v1.4.8' in src or 'v1.4.9' in src:
              raise SystemExit('Stale hard-coded collector version remains in runtime source')
          if 'Facebook → WordPress v${VERSION}' not in src:
              raise SystemExit('Panel does not use VERSION')
          if '`Να διαγραφεί ΟΛΗ η συλλογή του v${VERSION};`' not in src:
              raise SystemExit('Clear confirmation does not use VERSION')

          path.write_text(src, encoding='utf-8')
          PY

          node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Preserve unresolved date diagnostics'
          git push origin HEAD:main
