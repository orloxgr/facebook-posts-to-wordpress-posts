name: Release WordPress plugin v1.0.3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release WordPress plugin v1.0.3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-plugin/facebook-posts-to-wordpress -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd wordpress-plugin
          zip -r ../facebook-posts-to-wordpress-v1.0.3.zip facebook-posts-to-wordpress \
            -x '*/.DS_Store' '*/Thumbs.db'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create plugin-v1.0.3 \
            facebook-posts-to-wordpress-v1.0.3.zip \
            --target "$GITHUB_SHA" \
            --title "WordPress Plugin v1.0.3" \
            --notes "Plugin-only release. The first image is featured only and is never duplicated in post content. With two images, only the second appears below the text. With three or more images, all images after the featured image are rendered as a WordPress gallery."
