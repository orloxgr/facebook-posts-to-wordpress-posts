name: Two-pass collector v1.4.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/two-pass-v1.4.15.yml'
      - '.github/patch-v1.4.15.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collector
        run: |
          python3 .github/patch-v1.4.15.py
          node --check tampermonkey/facebook-posts-to-wordpress.user.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Add fast two-pass timestamp collection'
          git push origin HEAD:main
