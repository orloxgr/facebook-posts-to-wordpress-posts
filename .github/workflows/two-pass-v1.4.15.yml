name: Two-pass collector v1.4.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/two-pass-v1.4.15.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          
          from pathlib import Path
          import re
          
          path = Path('tampermonkey/facebook-posts-to-wordpress.user.js')
          src = path.read_text(encoding='utf-8')
          
          if '// @version      1.4.14' not in src:
              raise SystemExit('Expected collector version 1.4.14 not found')
          src = src.replace('// @version      1.4.14', '// @version      1.4.15', 1)
          
          wait_start = src.find('    async function waitForTimestampCandidates(article, timeoutMs = 1600) {')
          wait_end = src.find('\n\n    function collectTimestampDomDiagnostics(article) {', wait_start)
          if wait_start < 0 or wait_end < 0:
              raise SystemExit('waitForTimestampCandidates boundaries not found')
          
          new_wait = """    async function waitForTimestampCandidates(article, timeoutMs = 400) {
              const started = Date.now();
              let last = { values: [], timestampEl: null };
          
              try {
                  article.scrollIntoView({
                      block: 'center',
                      inline: 'nearest'
                  });
              } catch (_) {}
          
              // Short hydration window. A second pass handles misses.
              await new Promise(resolve => setTimeout(resolve, 80));
          
              while (Date.now() - started < timeoutMs) {
                  last = collectMainTimestampCandidates(article);
          
                  if (last.values.length) {
                      return last;
                  }
          
                  await new Promise(resolve => setTimeout(resolve, 80));
              }
          
              return last;
          }"""
          src = src[:wait_start] + new_wait + src[wait_end:]
          
          hover_start = src.find('    async function getDateFromHover(timestampEl) {')
          hover_end = src.find('\n    async function extractDate(article) {', hover_start)
          if hover_start < 0 or hover_end < 0:
              raise SystemExit('getDateFromHover boundaries not found')
          
          new_hover = r"""    async function getDateFromHover(timestampEl, timeoutMs = 600) {
              if (!timestampEl) {
                  return { date: null, source: '', hoverDebug: [] };
              }
          
              const observed = new Set();
              const baseline = new Set(collectTooltipTexts());
              const existingTooltips = new Set(
                  [...document.querySelectorAll('[role="tooltip"]')]
              );
          
              function addValue(value) {
                  const t = String(value || '')
                      .replace(/\u202f/g, ' ')
                      .trim();
          
                  if (
                      t &&
                      t.length <= 240 &&
                      looksLikeDateText(t) &&
                      !baseline.has(t)
                  ) {
                      observed.add(t);
                  }
              }
          
              function collectFromElement(el) {
                  if (!(el instanceof Element)) return;
          
                  for (const v of [
                      el.getAttribute?.('aria-label'),
                      el.getAttribute?.('title'),
                      el.innerText,
                      el.textContent
                  ]) {
                      addValue(v);
                  }
              }
          
              const observer = new MutationObserver(mutations => {
                  for (const mutation of mutations) {
                      for (const node of mutation.addedNodes) {
                          if (!(node instanceof Element)) continue;
          
                          const candidates = [];
          
                          if (
                              node.matches?.(
                                  '[role="tooltip"], [data-visualcompletion="ignore-dynamic"], [aria-live="polite"]'
                              )
                          ) {
                              candidates.push(node);
                          }
          
                          candidates.push(...(
                              node.querySelectorAll?.(
                                  '[role="tooltip"], [data-visualcompletion="ignore-dynamic"], [aria-live="polite"]'
                              ) || []
                          ));
          
                          for (const el of candidates) {
                              if (
                                  el.matches?.('[role="tooltip"]') &&
                                  existingTooltips.has(el)
                              ) {
                                  continue;
                              }
          
                              collectFromElement(el);
                          }
                      }
                  }
              });
          
              observer.observe(document.body, {
                  childList: true,
                  subtree: true
              });
          
              function collectNewTooltipTexts() {
                  for (const value of collectTooltipTexts()) {
                      addValue(value);
                  }
              }
          
              dispatchHover(timestampEl);
              const started = Date.now();
          
              while (Date.now() - started < timeoutMs) {
                  collectNewTooltipTexts();
          
                  for (const candidate of observed) {
                      const d = parseFbDate(candidate);
          
                      if (d && !isNaN(d)) {
                          observer.disconnect();
                          dispatchUnhover(timestampEl);
          
                          return {
                              date: d,
                              source: 'main timestamp tooltip: ' + candidate,
                              hoverDebug: [...observed].slice(0, 8)
                          };
                      }
                  }
          
                  await new Promise(resolve => setTimeout(resolve, 80));
                  dispatchHover(timestampEl);
              }
          
              observer.disconnect();
              dispatchUnhover(timestampEl);
              collectNewTooltipTexts();
          
              for (const candidate of observed) {
                  const d = parseFbDate(candidate);
          
                  if (d && !isNaN(d)) {
                      return {
                          date: d,
                          source: 'main timestamp tooltip: ' + candidate,
                          hoverDebug: [...observed].slice(0, 8)
                      };
                  }
              }
          
              return {
                  date: null,
                  source: [...observed].slice(0, 5).join(' | '),
                  hoverDebug: [...observed].slice(0, 8)
              };
          }
          """
          src = src[:hover_start] + new_hover + src[hover_end:]
          
          collect_start = src.find('    async function collectVisiblePosts(cutoffDate) {')
          collect_end = src.find('\n    function waitForFeedChange(', collect_start)
          if collect_start < 0 or collect_end < 0:
              raise SystemExit('collectVisiblePosts boundaries not found')
          block = src[collect_start:collect_end]
          
          block, n1 = re.subn(
              r'(const timestampBeforeExpand = await waitForTimestampCandidates\(\s*article,\s*)1600(\s*\);)',
              r'\g<1>400\g<2>',
              block,
              count=1
          )
          if n1 != 1:
              raise SystemExit(f'Pre-expand wait replacement count={n1}')
          
          block, n2 = re.subn(
              r'(const timestampDebug = await waitForTimestampCandidates\(\s*article,\s*)1600(\s*\);)',
              r'\g<1>400\g<2>',
              block,
              count=1
          )
          if n2 != 1:
              raise SystemExit(f'Post-expand wait replacement count={n2}')
          
          block, n3 = re.subn(
              r"""\n\s*if \(\s*!dateBeforeExpand\.date &&\s*timestampBeforeExpand\.timestampEl &&\s*timestampBeforeExpand\.timestampEl\.isConnected\s*\) \{\s*const hovered = await getDateFromHover\(\s*timestampBeforeExpand\.timestampEl\s*\);\s*if \(hovered\.date\) \{\s*dateBeforeExpand = hovered;\s*\}\s*\}\s*""",
              '\n',
              block,
              count=1
          )
          if n3 != 1:
              raise SystemExit(f'Pre-expand hover removal count={n3}')
          
          block, n4 = re.subn(
              r"""\n\s*if \(!dateInfo\.date && timestampDebug\.timestampEl\) \{\s*const hovered = await getDateFromHover\(\s*timestampDebug\.timestampEl\s*\);\s*if \(hovered\.date\) \{\s*dateInfo = hovered;\s*\}\s*\}\s*""",
              '\n',
              block,
              count=1
          )
          if n4 != 1:
              raise SystemExit(f'Post-expand hover removal count={n4}')
          
          marker = """        const repairedExactText =
              repairUnresolvedExactTextDuplicates(
                  map
              );
          """
          if marker not in block:
              raise SystemExit('Second-pass insertion marker not found')
          
          second_pass = r"""        /*
           * PASS 2:
           * Retry ONLY unresolved archive entries that are still mounted.
           * Dated entries are never touched and no duplicate item is created.
           */
          let secondPassRecovered = 0;
          
          const unresolvedKeys = new Set(
              [...map.entries()]
                  .filter(([, item]) => !item.dateIso)
                  .map(([key]) => key)
          );
          
          if (unresolvedKeys.size) {
              status(
                  `Pass 2: retrying ${unresolvedKeys.size} unresolved post(s)...`
              );
          
              const retryContainers =
                  getPostContainers().filter(isTargetPost);
          
              for (
                  let retryIndex = 0;
                  retryIndex < retryContainers.length;
                  retryIndex++
              ) {
                  if (collectorStopRequested || !unresolvedKeys.size) break;
          
                  const article = retryContainers[retryIndex];
                  const permalink = getPermalink(article);
                  const sourceId = extractPostId(permalink || '');
          
                  let existingKey = null;
          
                  if (
                      sourceId &&
                      sourceIdToKey.has(sourceId)
                  ) {
                      existingKey =
                          sourceIdToKey.get(sourceId);
                  } else {
                      const candidateKey =
                          archiveItemKey({ permalink });
          
                      if (
                          candidateKey &&
                          map.has(candidateKey)
                      ) {
                          existingKey = candidateKey;
                      }
                  }
          
                  if (
                      !existingKey ||
                      !unresolvedKeys.has(existingKey)
                  ) {
                      continue;
                  }
          
                  const existing = map.get(existingKey);
          
                  if (!existing || existing.dateIso) {
                      unresolvedKeys.delete(existingKey);
                      continue;
                  }
          
                  const retryTimestamp =
                      await waitForTimestampCandidates(
                          article,
                          800
                      );
          
                  let retryDateInfo = {
                      date: null,
                      source: 'main post timestamp unresolved',
                      hoverDebug: []
                  };
          
                  for (const candidate of retryTimestamp.values || []) {
                      const parsed = parseFbDate(candidate.value);
          
                      if (parsed && !isNaN(parsed)) {
                          retryDateInfo = {
                              date: parsed,
                              source:
                                  `${candidate.source}: ${candidate.value}`,
                              hoverDebug: []
                          };
                          break;
                      }
                  }
          
                  if (
                      !retryDateInfo.date &&
                      retryTimestamp.timestampEl &&
                      retryTimestamp.timestampEl.isConnected
                  ) {
                      const hovered =
                          await getDateFromHover(
                              retryTimestamp.timestampEl,
                              600
                          );
          
                      if (hovered.date) {
                          retryDateInfo = hovered;
                      }
                  }
          
                  if (!retryDateInfo.date) {
                      continue;
                  }
          
                  const retrySnapshot = {
                      ...existing,
                      dateIso:
                          retryDateInfo.date.toISOString(),
                      dateSource:
                          retryDateInfo.source || '',
                      dateDebug: {
                          ...(existing.dateDebug || {}),
                          retryPass: {
                              candidates:
                                  (retryTimestamp.values || [])
                                      .map(x => ({
                                          source: x.source,
                                          value: x.value
                                      })),
                              hasTimestampElement:
                                  Boolean(
                                      retryTimestamp.timestampEl
                                  ),
                              hoverDebug:
                                  retryDateInfo.hoverDebug || []
                          }
                      }
                  };
          
                  const merged =
                      mergeArchiveItems(
                          existing,
                          retrySnapshot
                      );
          
                  const newKey =
                      archiveItemKey(merged);
          
                  if (newKey !== existingKey) {
                      map.delete(existingKey);
                  }
          
                  map.set(newKey, merged);
          
                  fingerprintToKey.set(
                      merged.fingerprint,
                      newKey
                  );
          
                  const mergedSourceId =
                      extractPostId(
                          merged.permalink || ''
                      ) ||
                      (
                          merged.id &&
                          !String(merged.id)
                              .startsWith('fp-')
                              ? String(merged.id)
                              : ''
                      );
          
                  if (mergedSourceId) {
                      sourceIdToKey.set(
                          mergedSourceId,
                          newKey
                      );
                  }
          
                  unresolvedKeys.delete(existingKey);
                  secondPassRecovered++;
                  updatedCount++;
          
                  saveArchiveRaw(
                      [...map.values()]
                  );
          
                  article.style.outline =
                      '2px solid #35a853';
                  article.dataset.fbwp =
                      'collected-pass2';
              }
          
              log(
                  `Pass 2 recovered ${secondPassRecovered} unresolved post(s).`
              );
          }
          
          """ + marker
          
          block = block.replace(marker, second_pass, 1)
          
          old_return = """            unresolvedCount: actualUnresolved,
              repairedExactText,
              olderCount,"""
          new_return = """            unresolvedCount: actualUnresolved,
              secondPassRecovered,
              repairedExactText,
              olderCount,"""
          if old_return not in block:
              raise SystemExit('Return block not found')
          block = block.replace(old_return, new_return, 1)
          
          src = src[:collect_start] + block + src[collect_end:]
          
          for token in [
              '// @version      1.4.15',
              'const VERSION = String(GM_info.script.version);',
              'waitForTimestampCandidates(article, timeoutMs = 400)',
              'getDateFromHover(timestampEl, timeoutMs = 600)',
              'Pass 2 recovered',
              'secondPassRecovered'
          ]:
              if token not in src:
                  raise SystemExit('Missing expected token: ' + token)
          
          runtime_without_metadata = re.sub(
              r'^// @version\s+.*$',
              '',
              src,
              count=1,
              flags=re.M
          )
          stale = re.findall(
              r'\bv\d+\.\d+(?:\.\d+)?\b',
              runtime_without_metadata
          )
          if stale:
              raise SystemExit(
                  f'Hard-coded collector version strings remain: {stale[:10]}'
              )
          
          path.write_text(src, encoding='utf-8')
          PY
          node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Add fast two-pass timestamp collection'
          git push origin HEAD:main
