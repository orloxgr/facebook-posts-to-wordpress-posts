name: Two-pass collector v1.4.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/two-pass-v1.4.15.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch collector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('tampermonkey/facebook-posts-to-wordpress.user.js')
          src = path.read_text(encoding='utf-8')

          old_version = '// @version      1.4.14'
          new_version = '// @version      1.4.15'
          if old_version not in src:
              raise SystemExit('Expected collector version 1.4.14 not found')
          src = src.replace(old_version, new_version, 1)

          # Fast timestamp wait: pass 1 uses 400 ms; pass 2 can override it.
          start = src.find(
              '    async function waitForTimestampCandidates(article, timeoutMs = 1600) {'
          )
          end = src.find(
              '\n\n    function collectTimestampDomDiagnostics(article) {',
              start
          )
          if start < 0 or end < 0:
              raise SystemExit('waitForTimestampCandidates boundaries not found')

          new_wait = '''    async function waitForTimestampCandidates(article, timeoutMs = 400) {
              const started = Date.now();
              let last = { values: [], timestampEl: null };

              try {
                  article.scrollIntoView({
                      block: 'center',
                      inline: 'nearest'
                  });
              } catch (_) {}

              // Keep pass 1 quick. Misses are retried by pass 2.
              await new Promise(resolve => setTimeout(resolve, 80));

              while (Date.now() - started < timeoutMs) {
                  last = collectMainTimestampCandidates(article);

                  if (last.values.length) {
                      return last;
                  }

                  await new Promise(resolve => setTimeout(resolve, 80));
              }

              return last;
          }'''
          src = src[:start] + new_wait + src[end:]

          # Keep the tooltip fallback, but bound it tightly. It is used by pass 2,
          # not by the normal pass-1 collection path.
          hover_start = src.find('    async function getDateFromHover(timestampEl) {')
          hover_end = src.find('\n    async function extractDate(article) {', hover_start)
          if hover_start < 0 or hover_end < 0:
              raise SystemExit('getDateFromHover boundaries not found')

          hover = src[hover_start:hover_end]
          hover = hover.replace(
              'async function getDateFromHover(timestampEl) {',
              'async function getDateFromHover(timestampEl, timeoutMs = 600) {',
              1
          )
          hover = hover.replace(
              'while (Date.now() - hoverStarted < 1200) {',
              'while (Date.now() - hoverStarted < timeoutMs) {',
              1
          )
          hover = hover.replace(
              'while (Date.now() - focusStarted < 700) {',
              'while (Date.now() - focusStarted < 250) {',
              1
          )
          hover = hover.replace(
              'setTimeout(resolve, 100)',
              'setTimeout(resolve, 80)'
          )
          if 'timeoutMs = 600' not in hover:
              raise SystemExit('Hover timeout patch failed')
          src = src[:hover_start] + hover + src[hover_end:]

          collect_start = src.find('    async function collectVisiblePosts(cutoffDate) {')
          collect_end = src.find('\n    function waitForFeedChange(', collect_start)
          if collect_start < 0 or collect_end < 0:
              raise SystemExit('collectVisiblePosts boundaries not found')
          block = src[collect_start:collect_end]

          # Both pass-1 timestamp reads are short.
          block, n1 = re.subn(
              r'(const timestampBeforeExpand = await waitForTimestampCandidates\(\s*article,\s*)1600(\s*\);)',
              r'\g<1>400\g<2>',
              block,
              count=1
          )
          block, n2 = re.subn(
              r'(const timestampDebug = await waitForTimestampCandidates\(\s*article,\s*)1600(\s*\);)',
              r'\g<1>400\g<2>',
              block,
              count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Pass-1 wait patch failed: before={n1}, after={n2}')

          # No tooltip/focus delay in pass 1 before See more.
          pre_start = block.find('  if (\n      !dateBeforeExpand.date &&')
          pre_end = block.find('\n  const expandInfo = await expandArticleBeforeCollect(article);', pre_start)
          if pre_start < 0 or pre_end < 0:
              raise SystemExit('Pre-expand hover block boundaries not found')
          block = block[:pre_start] + block[pre_end + 1:]

          # No tooltip/focus delay in pass 1 after See more.
          post_start = block.find(
              '            if (!dateInfo.date && timestampDebug.timestampEl) {'
          )
          post_end = block.find(
              '            if (!dateInfo.date && dateBeforeExpand.date) {',
              post_start
          )
          if post_start < 0 or post_end < 0:
              raise SystemExit('Post-expand hover block boundaries not found')
          block = block[:post_start] + block[post_end:]

          # Insert the retry pass before the existing exact-text repair.
          marker_start = block.find('        const repairedExactText =')
          if marker_start < 0:
              raise SystemExit('Second-pass insertion point not found')

          second_pass = r'''        /*
           * PASS 2:
           * Retry only entries that are still unresolved and still mounted.
           * Already-dated items are never touched and no duplicate is created.
           */
          let secondPassRecovered = 0;

          const unresolvedKeys = new Set(
              [...map.entries()]
                  .filter(([, item]) => !item.dateIso)
                  .map(([key]) => key)
          );

          if (unresolvedKeys.size) {
              status(
                  `Pass 2: retrying ${unresolvedKeys.size} unresolved post(s)...`
              );

              const retryContainers =
                  getPostContainers().filter(isTargetPost);

              for (
                  let retryIndex = 0;
                  retryIndex < retryContainers.length;
                  retryIndex++
              ) {
                  if (collectorStopRequested || !unresolvedKeys.size) break;

                  const article = retryContainers[retryIndex];
                  const permalink = getPermalink(article);
                  const sourceId = extractPostId(permalink || '');

                  let existingKey = null;

                  if (
                      sourceId &&
                      sourceIdToKey.has(sourceId)
                  ) {
                      existingKey = sourceIdToKey.get(sourceId);
                  } else {
                      const candidateKey = archiveItemKey({ permalink });
                      if (candidateKey && map.has(candidateKey)) {
                          existingKey = candidateKey;
                      }
                  }

                  if (
                      !existingKey ||
                      !unresolvedKeys.has(existingKey)
                  ) {
                      continue;
                  }

                  const existing = map.get(existingKey);
                  if (!existing || existing.dateIso) {
                      unresolvedKeys.delete(existingKey);
                      continue;
                  }

                  const retryTimestamp =
                      await waitForTimestampCandidates(article, 800);

                  let retryDateInfo = {
                      date: null,
                      source: 'main post timestamp unresolved',
                      hoverDebug: []
                  };

                  for (const candidate of retryTimestamp.values || []) {
                      const parsed = parseFbDate(candidate.value);
                      if (parsed && !isNaN(parsed)) {
                          retryDateInfo = {
                              date: parsed,
                              source: `${candidate.source}: ${candidate.value}`,
                              hoverDebug: []
                          };
                          break;
                      }
                  }

                  if (
                      !retryDateInfo.date &&
                      retryTimestamp.timestampEl &&
                      retryTimestamp.timestampEl.isConnected
                  ) {
                      const hovered = await getDateFromHover(
                          retryTimestamp.timestampEl,
                          600
                      );
                      if (hovered.date) {
                          retryDateInfo = hovered;
                      }
                  }

                  if (!retryDateInfo.date) {
                      continue;
                  }

                  const retrySnapshot = {
                      ...existing,
                      dateIso: retryDateInfo.date.toISOString(),
                      dateSource: retryDateInfo.source || '',
                      dateDebug: {
                          ...(existing.dateDebug || {}),
                          retryPass: {
                              candidates: (retryTimestamp.values || []).map(x => ({
                                  source: x.source,
                                  value: x.value
                              })),
                              hasTimestampElement: Boolean(
                                  retryTimestamp.timestampEl
                              ),
                              hoverDebug: retryDateInfo.hoverDebug || []
                          }
                      }
                  };

                  const merged = mergeArchiveItems(
                      existing,
                      retrySnapshot
                  );
                  const newKey = archiveItemKey(merged);

                  if (newKey !== existingKey) {
                      map.delete(existingKey);
                  }
                  map.set(newKey, merged);
                  fingerprintToKey.set(merged.fingerprint, newKey);

                  const mergedSourceId =
                      extractPostId(merged.permalink || '') ||
                      (
                          merged.id &&
                          !String(merged.id).startsWith('fp-')
                              ? String(merged.id)
                              : ''
                      );

                  if (mergedSourceId) {
                      sourceIdToKey.set(mergedSourceId, newKey);
                  }

                  unresolvedKeys.delete(existingKey);
                  secondPassRecovered++;
                  updatedCount++;

                  saveArchiveRaw([...map.values()]);

                  article.style.outline = '2px solid #35a853';
                  article.dataset.fbwp = 'collected-pass2';
              }

              log(
                  `Pass 2 recovered ${secondPassRecovered} unresolved post(s).`
              );
          }

'''
          block = block[:marker_start] + second_pass + block[marker_start:]

          # Expose retry stats in the collector result.
          return_marker = '            unresolvedCount: actualUnresolved,\n'
          if return_marker not in block:
              raise SystemExit('Return unresolvedCount marker not found')
          block = block.replace(
              return_marker,
              return_marker + '            secondPassRecovered,\n',
              1
          )

          # Verify pass 1 really has no hover before the PASS 2 block.
          pass2_pos = block.find('         * PASS 2:')
          if pass2_pos < 0:
              raise SystemExit('PASS 2 marker missing')
          if 'getDateFromHover(' in block[:pass2_pos]:
              raise SystemExit('Pass 1 still contains a hover call')

          src = src[:collect_start] + block + src[collect_end:]

          for token in [
              '// @version      1.4.15',
              'const VERSION = String(GM_info.script.version);',
              'waitForTimestampCandidates(article, timeoutMs = 400)',
              'getDateFromHover(timestampEl, timeoutMs = 600)',
              'waitForTimestampCandidates(article, 800)',
              'Pass 2 recovered',
              'secondPassRecovered'
          ]:
              if token not in src:
                  raise SystemExit('Missing expected token: ' + token)

          runtime_without_metadata = re.sub(
              r'^// @version\s+.*$',
              '',
              src,
              count=1,
              flags=re.M
          )
          stale = re.findall(
              r'\bv\d+\.\d+(?:\.\d+)?\b',
              runtime_without_metadata
          )
          if stale:
              raise SystemExit(
                  f'Hard-coded collector version strings remain: {stale[:10]}'
              )

          path.write_text(src, encoding='utf-8')
          PY

          node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Add fast two-pass timestamp collection'
          git push origin HEAD:main
