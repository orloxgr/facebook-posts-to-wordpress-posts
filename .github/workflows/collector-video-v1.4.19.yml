name: Collector video metadata v1.4.19

on:
  push:
    paths:
      - '.github/workflows/collector-video-v1.4.19.yml'
      - '.github/scripts/update_collector_video_v1_4_19.py'

permissions:
  contents: write

jobs:
  update-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply collector patch
        run: python3 .github/scripts/update_collector_video_v1_4_19.py

      - name: JavaScript syntax check
        run: node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Verify video collector markers
        shell: bash
        run: |
          grep -F '// @version      1.4.19' tampermonkey/facebook-posts-to-wordpress.user.js
          grep -F 'function extractVideo(article, permalink' tampermonkey/facebook-posts-to-wordpress.user.js
          grep -F 'video: item.video || null' tampermonkey/facebook-posts-to-wordpress.user.js
          grep -F 'downloadableVideos' tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit collector update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Add Facebook video metadata collection v1.4.19'
          git push
