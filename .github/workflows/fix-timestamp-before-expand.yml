name: Fix timestamp capture before See more

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Retry2 timestamp capture fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch collector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tampermonkey/facebook-posts-to-wordpress.user.js')
          src = path.read_text(encoding='utf-8')

          if '// @version      1.4.10' not in src:
              raise SystemExit('Expected collector version 1.4.10 not found')
          src = src.replace('// @version      1.4.10', '// @version      1.4.11', 1)

          collect_pos = src.find('    async function collectVisiblePosts(cutoffDate) {')
          if collect_pos < 0:
              raise SystemExit('collectVisiblePosts not found')

          anchor = '            const expandInfo = await expandArticleBeforeCollect(article);'
          anchor_pos = src.find(anchor, collect_pos)
          if anchor_pos < 0:
              raise SystemExit('expand anchor not found in collectVisiblePosts')

          inserted = '''            /* Capture the structural timestamp before See more can replace the React subtree. */
            const timestampBeforeExpand = await waitForTimestampCandidates(
                article,
                1600
            );

            let dateBeforeExpand = {
                date: null,
                source: 'main post timestamp unresolved'
            };

            for (const candidate of timestampBeforeExpand.values || []) {
                const parsed = parseFbDate(candidate.value);

                if (parsed && !isNaN(parsed)) {
                    dateBeforeExpand = {
                        date: parsed,
                        source: `${candidate.source}: ${candidate.value}`
                    };
                    break;
                }
            }

            if (
                !dateBeforeExpand.date &&
                timestampBeforeExpand.timestampEl &&
                timestampBeforeExpand.timestampEl.isConnected
            ) {
                const hovered = await getDateFromHover(
                    timestampBeforeExpand.timestampEl
                );

                if (hovered.date) {
                    dateBeforeExpand = hovered;
                }
            }

            const expandInfo = await expandArticleBeforeCollect(article);'''

          src = src[:anchor_pos] + inserted + src[anchor_pos + len(anchor):]

          fallback_anchor = '            const dateValue = dateInfo.date;'
          fallback_pos = src.find(fallback_anchor, anchor_pos + len(inserted))
          if fallback_pos < 0:
              raise SystemExit('dateValue anchor not found after expand block')

          fallback = '''            if (!dateInfo.date && dateBeforeExpand.date) {
                dateInfo = dateBeforeExpand;
            }

            const dateValue = dateInfo.date;'''

          src = src[:fallback_pos] + fallback + src[fallback_pos + len(fallback_anchor):]

          src = src.replace(
              'This also repairs v1.0/v1.1 entries whose keys contained __cft__[0].',
              'This also repairs legacy entries whose keys contained __cft__[0].'
          )
          src = src.replace(
              "log('Loaded. Scroll the Page, then click Expand + Scan v0.4.');",
              "log(`Loaded collector v${VERSION}.`);"
          )

          if 'const VERSION = String(GM_info.script.version);' not in src:
              raise SystemExit('Single version source missing')
          if 'timestampBeforeExpand' not in src:
              raise SystemExit('Pre-expand timestamp capture missing')
          if "v0.4" in src or "v1.0/v1.1" in src:
              raise SystemExit('Stale hard-coded version text remains')

          path.write_text(src, encoding='utf-8')
          PY

          node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+orloxgr@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Capture timestamps before expanding posts'
          git push origin HEAD:main
