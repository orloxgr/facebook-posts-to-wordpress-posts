name: Add timestamp DOM diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-timestamp-dom-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch collector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('tampermonkey/facebook-posts-to-wordpress.user.js')
          s = p.read_text(encoding='utf-8')

          if '// @version      1.4.11' not in s:
              raise SystemExit('Expected v1.4.11')
          s = s.replace('// @version      1.4.11', '// @version      1.4.12', 1)

          marker = '    async function collectVisiblePosts(cutoffDate) {'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('collectVisiblePosts not found')

          helper = r'''    function collectTimestampDomDiagnostics(article) {
        if (!article) return null;

        const profile = article.querySelector('[data-ad-rendering-role="profile_name"]');
        const story = article.querySelector('[data-ad-rendering-role="story_message"]');
        let headerScope = profile || article;

        if (profile) {
            let current = profile;
            while (current.parentElement && current.parentElement !== article) {
                const parent = current.parentElement;
                if (story && parent.contains(story)) break;
                headerScope = parent;
                current = parent;
            }
        }

        function describe(el) {
            if (!el || el.nodeType !== 1) return null;
            return {
                tag: el.tagName,
                text: String(el.innerText || el.textContent || '')
                    .replace(/\s+/g, ' ').trim().slice(0, 240),
                href: el.getAttribute('href'),
                role: el.getAttribute('role'),
                ariaLabel: el.getAttribute('aria-label'),
                ariaLabelledby: el.getAttribute('aria-labelledby'),
                title: el.getAttribute('title'),
                target: el.getAttribute('target'),
                dataUtime: el.getAttribute('data-utime'),
                datetime: el.getAttribute('datetime'),
                dataAdRenderingRole: el.getAttribute('data-ad-rendering-role'),
                className: String(el.getAttribute('class') || '').slice(0, 320)
            };
        }

        const selector = [
            'a', 'time', 'abbr', '[role="link"]', '[role="button"]',
            '[aria-label]', '[aria-labelledby]', '[title]', '[data-utime]', '[datetime]'
        ].join(',');

        const elements = [];
        const seen = new Set();
        for (const el of headerScope.querySelectorAll(selector)) {
            if (elements.length >= 120) break;
            if (seen.has(el)) continue;
            seen.add(el);
            const item = describe(el);
            if (item) elements.push(item);
        }

        const profileAncestors = [];
        let current = profile;
        let depth = 0;
        while (current && depth < 8) {
            const item = describe(current);
            if (item) profileAncestors.push(item);
            if (current === article) break;
            current = current.parentElement;
            depth++;
        }

        return {
            headerScope: describe(headerScope),
            profile: describe(profile),
            profileAncestors,
            elements
        };
    }

'''

          if 'function collectTimestampDomDiagnostics(' in s:
              raise SystemExit('diagnostics helper already exists')
          s = s[:pos] + helper + s[pos:]
          pos += len(helper)

          old = '''                dateDebug: {
                    candidates: (timestampDebug.values || []).map(x => ({
                        source: x.source,
                        value: x.value
                    })),
                    hasTimestampElement: Boolean(
                        timestampDebug.timestampEl
                    )
                },'''

          new = '''                dateDebug: {
                    candidates: [
                        ...(timestampBeforeExpand.values || []),
                        ...(timestampDebug.values || [])
                    ].map(x => ({
                        source: x.source,
                        value: x.value
                    })),
                    hasTimestampElement: Boolean(
                        timestampBeforeExpand.timestampEl ||
                        timestampDebug.timestampEl
                    ),
                    beforeExpand: {
                        candidates: (timestampBeforeExpand.values || []).map(x => ({
                            source: x.source,
                            value: x.value
                        })),
                        hasTimestampElement: Boolean(timestampBeforeExpand.timestampEl)
                    },
                    afterExpand: {
                        candidates: (timestampDebug.values || []).map(x => ({
                            source: x.source,
                            value: x.value
                        })),
                        hasTimestampElement: Boolean(timestampDebug.timestampEl)
                    },
                    dom: dateValue ? null : collectTimestampDomDiagnostics(article)
                },'''

          dpos = s.find(old, pos)
          if dpos < 0:
              raise SystemExit('dateDebug block not found')
          s = s[:dpos] + new + s[dpos + len(old):]

          p.write_text(s, encoding='utf-8')
          PY

          node --check tampermonkey/facebook-posts-to-wordpress.user.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tampermonkey/facebook-posts-to-wordpress.user.js
          git commit -m 'Add unresolved timestamp DOM diagnostics'
          git push origin HEAD:main
